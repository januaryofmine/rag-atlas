services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag_atlas
      POSTGRES_USER: rag_atlas
      POSTGRES_PASSWORD: rag_atlas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rag_atlas_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_atlas -d rag_atlas"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rag_atlas:rag_atlas@postgres:5432/rag_atlas
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rag_atlas:rag_atlas@postgres:5432/rag_atlas
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  app:
    build:
      context: ./app
      args:
        NEXT_PUBLIC_RAG_ATLAS_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  rag_atlas_pg:
